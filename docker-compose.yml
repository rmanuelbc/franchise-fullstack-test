services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Data Source=/data/franchises.db
      Authentication__Issuer: Franchise.Api
      Authentication__Audience: Franchise.Frontend
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Authentication__AdminUsername: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      Authentication__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "5206:8080"
    volumes:
      - franchise-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5206/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  franchise-data:
